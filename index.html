<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lighthouse at Night</title>
<style>
  html,body{margin:0;height:100%;background:#050914;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  .cap{position:fixed;left:20px;bottom:16px;font:500 13px/1.3 system-ui,Segoe UI,sans-serif;
       letter-spacing:.14em;text-transform:uppercase;color:rgba(200,220,255,.55);pointer-events:none;
       text-shadow:0 1px 6px #000}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Animated night scene: a lighthouse on a rock sweeping its beam across a moonlit, wavy sea"></canvas>
<div class="cap">The Lighthouse · Night Watch</div>
<script>
(() => {
const cv = document.getElementById('c'), g = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const speed = reduce ? 0.3 : 1;
let W, H, dpr, stars = [], clouds = [], spray = [];

function rnd(seed){ let s = seed; return () => (s = (s*16807) % 2147483647) / 2147483647; }

function resize(){
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  g.setTransform(dpr,0,0,dpr,0,0);
  const r = rnd(42);
  stars = Array.from({length: Math.round(W*H/5000)}, () => ({
    x: r()*W, y: r()*H*0.62, s: r()*1.4+0.3, p: r()*6.28, f: 0.5+r()*2
  }));
  clouds = Array.from({length: 6}, (_, i) => ({
    x: r()*W*1.4 - W*0.2, y: H*(0.08+r()*0.32), w: W*(0.18+r()*0.25), h: H*(0.03+r()*0.04), v: 4+r()*8, a: 0.25+r()*0.25
  }));
}
addEventListener('resize', resize); resize();

function layout(){
  const horizon = H*0.60;
  const u = Math.min(W, H*1.5)/100;
  const tx = W*(W < 700 ? 0.5 : 0.68);
  const baseY = H*0.84;
  const th = Math.min(H*0.5, 56*u);
  return {horizon, u, tx, baseY, th, topY: baseY - th};
}

function drawSky(L, t){
  const sk = g.createLinearGradient(0,0,0,L.horizon);
  sk.addColorStop(0,'#03060f'); sk.addColorStop(0.55,'#0a1630'); sk.addColorStop(1,'#1c3358');
  g.fillStyle = sk; g.fillRect(0,0,W,H);
  for (const s of stars){
    const a = 0.35 + 0.65*(0.5+0.5*Math.sin(t*s.f*speed + s.p));
    g.fillStyle = `rgba(220,232,255,${a*0.9})`;
    g.beginPath(); g.arc(s.x, s.y, s.s*0.7, 0, 6.283); g.fill();
  }
  // moon
  const mx = W*0.2, my = H*0.2, mr = Math.min(W,H)*0.05;
  let h = g.createRadialGradient(mx,my,mr*0.5,mx,my,mr*7);
  h.addColorStop(0,'rgba(190,210,255,.28)'); h.addColorStop(1,'rgba(190,210,255,0)');
  g.fillStyle = h; g.fillRect(mx-mr*7,my-mr*7,mr*14,mr*14);
  g.fillStyle = '#eef3ff'; g.beginPath(); g.arc(mx,my,mr,0,6.283); g.fill();
  g.fillStyle = 'rgba(150,170,210,.35)';
  [[-.3,-.2,.22],[.25,.15,.3],[.1,-.45,.14],[-.35,.3,.12]].forEach(([a,b,c]) => {
    g.beginPath(); g.arc(mx+a*mr,my+b*mr,c*mr,0,6.283); g.fill();
  });
  // clouds
  for (const c of clouds){
    const x = ((c.x + t*c.v*speed) % (W*1.4 + c.w)) - c.w;
    const cg = g.createRadialGradient(x+c.w/2,c.y,0,x+c.w/2,c.y,c.w/2);
    cg.addColorStop(0,`rgba(90,115,165,${c.a})`); cg.addColorStop(1,'rgba(90,115,165,0)');
    g.save(); g.translate(x+c.w/2,c.y); g.scale(1,c.h/(c.w/2)); g.translate(-(x+c.w/2),-c.y);
    g.fillStyle = cg; g.beginPath(); g.arc(x+c.w/2,c.y,c.w/2,0,6.283); g.fill(); g.restore();
  }
}

// wave height function for a layer
function waveY(x, t, layer, L){
  const k = layer.k, amp = layer.amp*(reduce?0.6:1);
  return layer.y + amp*Math.sin(x*k + t*layer.sp*speed + layer.ph)
       + amp*0.5*Math.sin(x*k*2.1 - t*layer.sp*1.3*speed + layer.ph*2)
       + amp*0.25*Math.sin(x*k*4.3 + t*layer.sp*1.9*speed);
}
function layers(L){
  const h = L.horizon, H2 = H - h;
  return [
    {y:h+H2*0.02, amp:H2*0.006, k:0.030, sp:0.7, ph:0, c0:'#10264a', c1:'#0a1a35'},
    {y:h+H2*0.10, amp:H2*0.012, k:0.020, sp:0.9, ph:1.3, c0:'#0f2447', c1:'#081631'},
    {y:h+H2*0.22, amp:H2*0.020, k:0.014, sp:1.1, ph:2.1, c0:'#0c1f3d', c1:'#061029'},
    {y:h+H2*0.38, amp:H2*0.030, k:0.010, sp:1.3, ph:3.4, c0:'#0a1a35', c1:'#040b1e'},
  ];
}
function fillWave(layer, t, L, front){
  g.beginPath(); g.moveTo(0,H);
  for (let x=0; x<=W+6; x+=6) g.lineTo(x, waveY(x,t,layer,L));
  g.lineTo(W,H); g.closePath();
  const gr = g.createLinearGradient(0,layer.y-layer.amp*2,0,H);
  gr.addColorStop(0,layer.c0); gr.addColorStop(1,layer.c1);
  g.fillStyle = gr; g.fill();
  // crest highlight
  g.beginPath();
  for (let x=0; x<=W+6; x+=6){ const y = waveY(x,t,layer,L); x? g.lineTo(x,y) : g.moveTo(x,y); }
  g.strokeStyle = front ? 'rgba(200,225,255,.22)' : 'rgba(150,185,235,.14)';
  g.lineWidth = front ? 1.6 : 1; g.stroke();
}

function moonGlitter(L, t){
  const mx = W*0.2, top = L.horizon;
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i=0;i<70;i++){
    const f = i/70, y = top + f*(H-top)*0.55 + 2;
    const wob = Math.sin(t*1.6*speed + i*1.7)*(6+f*30);
    const wd = (12 + f*90) * (0.4+0.6*Math.abs(Math.sin(t*0.9*speed + i*3.1)));
    g.fillStyle = `rgba(190,210,255,${0.22*(1-f*0.6)})`;
    g.fillRect(mx + wob - wd/2, y, wd, 1.4+f*1.6);
  }
  g.restore();
}

function drawRock(L){
  const {tx, baseY, u} = L;
  const r = rnd(7), pts = [];
  const hw = 24*u;
  pts.push([tx-hw*1.5, baseY+12*u]);
  const n = 12;
  for (let i=0;i<=n;i++){
    const f = i/n, x = tx - hw + f*hw*2;
    const dome = Math.sin(f*Math.PI);
    pts.push([x, baseY - dome*4.5*u + (r()-0.5)*1.6*u + 2.2*u]);
  }
  pts.push([tx+hw*1.5, baseY+12*u]);
  const gr = g.createLinearGradient(0,baseY-3*u,0,baseY+10*u);
  gr.addColorStop(0,'#1a2233'); gr.addColorStop(1,'#080b14');
  g.fillStyle = gr; g.beginPath();
  pts.forEach(([x,y],i)=> i? g.lineTo(x,y):g.moveTo(x,y)); g.closePath(); g.fill();
  g.strokeStyle='rgba(120,150,200,.18)'; g.lineWidth=1; g.stroke();
}

function drawTower(L, t, glow){
  const {tx, baseY, u, th, topY} = L;
  const bw = 9*u, tw = 5.4*u;           // base/top half-widths in px
  const y0 = baseY, y1 = topY + 5*u;    // tower shaft from y0 up to y1
  const wAt = y => tw + (bw-tw)*((y-y1)/(y0-y1));
  // shaft with stripes
  const stripes = 5, sh = (y0-y1)/stripes;
  for (let i=0;i<stripes;i++){
    const ya = y1 + i*sh, yb = ya + sh, wa = wAt(ya), wb = wAt(yb);
    const red = i%2===0;
    const gr = g.createLinearGradient(tx-wb,0,tx+wb,0);
    // moonlit left side, shadowed right, plus warm lamp tint
    gr.addColorStop(0, red? '#8a3a44':'#aab4c6');
    gr.addColorStop(0.45, red? '#6c2a35':'#7d889e');
    gr.addColorStop(1, red? '#2b1118':'#2a3245');
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(tx-wa,ya); g.lineTo(tx+wa,ya); g.lineTo(tx+wb,yb); g.lineTo(tx-wb,yb); g.closePath(); g.fill();
  }
  // windows
  for (let i=1;i<stripes;i+=2){
    const y = y1 + i*sh + sh*0.45;
    g.fillStyle = 'rgba(255,215,130,.95)';
    g.beginPath(); g.roundRect(tx-0.55*u, y-1.2*u, 1.1*u, 2.2*u, 0.5*u); g.fill();
  }
  // door
  g.fillStyle = '#1a0f12'; g.beginPath(); g.roundRect(tx-1.1*u, y0-3.6*u, 2.2*u, 3.6*u, [1.1*u,1.1*u,0,0]); g.fill();

  // gallery
  const gy = y1;
  g.fillStyle = '#12182a'; g.fillRect(tx-tw-1.6*u, gy-0.5*u, (tw+1.6*u)*2, 1.1*u);
  g.strokeStyle = '#0c111f'; g.lineWidth = Math.max(1, 0.18*u);
  for (let x=-tw-1.4*u; x<=tw+1.5*u; x+=1.5*u){ g.beginPath(); g.moveTo(tx+x,gy-0.5*u); g.lineTo(tx+x,gy-2.4*u); g.stroke(); }
  g.beginPath(); g.moveTo(tx-tw-1.6*u,gy-2.4*u); g.lineTo(tx+tw+1.6*u,gy-2.4*u); g.stroke();

  // lantern room
  const lw = tw*0.82, lh = 5.2*u, ly0 = gy-0.5*u, ly1 = ly0 - lh;
  const lg = g.createLinearGradient(0,ly1,0,ly0);
  lg.addColorStop(0,'#fff6cf'); lg.addColorStop(1,'#ffd678');
  g.fillStyle = lg; g.fillRect(tx-lw, ly1, lw*2, lh);
  // glow halo
  g.save(); g.globalCompositeOperation='lighter';
  const hr = 16*u*(0.8+0.5*glow);
  const hg = g.createRadialGradient(tx,(ly0+ly1)/2,0,tx,(ly0+ly1)/2,hr);
  hg.addColorStop(0,`rgba(255,225,150,${0.55+0.35*glow})`); hg.addColorStop(1,'rgba(255,200,100,0)');
  g.fillStyle=hg; g.fillRect(tx-hr,(ly0+ly1)/2-hr,hr*2,hr*2);
  g.restore();
  // lens mullions
  g.strokeStyle='#1b1620'; g.lineWidth=Math.max(1,0.28*u);
  for (const f of [-0.5,0,0.5]){ g.beginPath(); g.moveTo(tx+f*lw*1.5,ly1); g.lineTo(tx+f*lw*1.5,ly0); g.stroke(); }
  g.strokeRect(tx-lw, ly1, lw*2, lh);
  // roof
  g.fillStyle='#7a2733';
  g.beginPath(); g.moveTo(tx-lw-0.9*u,ly1); g.quadraticCurveTo(tx,ly1-6.4*u,tx+lw+0.9*u,ly1); g.closePath(); g.fill();
  g.fillStyle='#14182a'; g.fillRect(tx-0.12*u, ly1-8.4*u, 0.24*u, 2.4*u);
  g.beginPath(); g.arc(tx, ly1-3.2*u, 0.7*u, 0, 6.283); g.fill();
  return {x: tx, y: (ly0+ly1)/2};
}

function drawBeams(L, t, lamp){
  const theta = t*0.9*speed;
  const reach = Math.max(W, H)*1.25;
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let k=0;k<2;k++){
    const a = theta + k*Math.PI, cx = Math.cos(a), cz = Math.sin(a);
    const dir = cx >= 0 ? 1 : -1, len = Math.abs(cx)**0.7*reach + 30;
    const near = Math.max(0, cz);                // 1 when facing the viewer
    const spread = (0.012 + 0.06*near + 0.01*Math.abs(cx))*H;
    const dropEnd = L.horizon - lamp.y + H*0.02*(1-near);
    const ex = lamp.x + dir*len, ey = lamp.y + dropEnd*Math.abs(cx)*0.55;
    const gr = g.createLinearGradient(lamp.x,lamp.y,ex,ey);
    const base = 0.55*(1 - 0.5*near);
    gr.addColorStop(0,`rgba(255,240,190,${base})`);
    gr.addColorStop(0.35,`rgba(255,235,170,${base*0.45})`);
    gr.addColorStop(1,'rgba(255,230,160,0)');
    g.fillStyle = gr;
    g.beginPath(); g.moveTo(lamp.x,lamp.y-1);
    g.lineTo(ex, ey - spread*0.5 - spread*Math.abs(cx)); g.lineTo(ex, ey + spread*0.5 + spread*Math.abs(cx));
    g.lineTo(lamp.x,lamp.y+1); g.closePath(); g.fill();
    // bright core
    g.fillStyle = gr; g.globalAlpha = 0.6;
    g.beginPath(); g.moveTo(lamp.x,lamp.y);
    g.lineTo(ex,ey-spread*0.12); g.lineTo(ex,ey+spread*0.12); g.closePath(); g.fill(); g.globalAlpha = 1;
    // flash when pointing at viewer
    if (near > 0.01){
      const f = near**5, r = (18 + 90*f)*L.u*0.5;
      const fg = g.createRadialGradient(lamp.x,lamp.y,0,lamp.x,lamp.y,r);
      fg.addColorStop(0,`rgba(255,248,215,${0.95*f})`);
      fg.addColorStop(0.3,`rgba(255,230,160,${0.4*f})`);
      fg.addColorStop(1,'rgba(255,220,140,0)');
      g.fillStyle = fg; g.fillRect(lamp.x-r,lamp.y-r,r*2,r*2);
    }
  }
  g.restore();
  // returns the beam-facing intensity for glow
  return Math.max(0, Math.sin(theta), Math.sin(theta+Math.PI));
}

function beamOnWater(L, t){
  // light sweeping glints on the near sea
  const theta = t*0.9*speed;
  g.save(); g.globalCompositeOperation='lighter';
  for (let k=0;k<2;k++){
    const a = theta + k*Math.PI, cx = Math.cos(a);
    const dir = cx>=0?1:-1, m = Math.abs(cx);
    for (let i=0;i<40;i++){
      const f = i/40, y = L.horizon + 4 + f*(H-L.horizon)*0.5;
      const x = L.tx + dir*(m*f*W*0.9 + Math.sin(t*2+i)*8);
      const w = 10 + f*80*m;
      g.fillStyle = `rgba(255,235,170,${0.16*m*(1-f*0.7)})`;
      g.fillRect(x-w/2, y, w, 1.5+f*2);
    }
  }
  g.restore();
}

function foam(L, t){
  // foam + spray around rock base
  const y = L.baseY + 3*L.u;
  g.save();
  g.strokeStyle = 'rgba(235,245,255,.55)'; g.lineWidth = Math.max(1.5, L.u*0.35); g.lineCap='round';
  for (let i=0;i<9;i++){
    const f = i/8 - 0.5;
    const x = L.tx + f*40*L.u;
    const pulse = 0.5 + 0.5*Math.sin(t*1.6*speed + i*1.2);
    const w = (2+3*pulse)*L.u;
    g.globalAlpha = 0.25 + 0.5*pulse;
    g.beginPath(); g.moveTo(x-w, y + Math.sin(i)*L.u*0.5); g.lineTo(x+w, y + Math.sin(i)*L.u*0.5); g.stroke();
  }
  g.restore();
  // spray particles
  if (Math.random() < 0.18*speed){
    const sx = L.tx + (Math.random()-0.5)*34*L.u;
    for (let i=0;i<5;i++) spray.push({x:sx,y:y,vx:(Math.random()-0.5)*40*(L.u/6),vy:-(30+Math.random()*60)*(L.u/6),life:1});
  }
}
let lastT = 0;
function drawSpray(dt){
  g.fillStyle='rgba(230,242,255,1)';
  for (let i=spray.length-1;i>=0;i--){
    const p = spray[i]; p.life -= dt*1.1; p.vy += 140*dt*(W/1000>1?1:1); p.x += p.vx*dt; p.y += p.vy*dt;
    if (p.life<=0){ spray.splice(i,1); continue; }
    g.globalAlpha = p.life*0.7; g.beginPath(); g.arc(p.x,p.y,1.3,0,6.283); g.fill();
  }
  g.globalAlpha = 1;
}

function frame(ms){
  const t = ms/1000, dt = Math.min(0.05, t - lastT); lastT = t;
  const L = layout(), lay = layers(L);
  drawSky(L, t);
  // far sea layers
  fillWave(lay[0], t, L, false);
  moonGlitter(L, t);
  fillWave(lay[1], t, L, false);
  beamOnWater(L, t);
  // rock + tower sit between mid and near waves
  fillWave(lay[2], t, L, false);
  drawRock(L);
  const glow = Math.max(0, Math.sin(t*0.9*speed), Math.sin(t*0.9*speed+Math.PI));
  const lamp = drawTower(L, t, glow);
  drawBeams(L, t, lamp);
  foam(L, t);
  fillWave(lay[3], t, L, true);
  drawSpray(dt);
  // vignette
  const v = g.createRadialGradient(W/2,H/2,Math.min(W,H)*0.4,W/2,H/2,Math.max(W,H)*0.75);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.45)');
  g.fillStyle = v; g.fillRect(0,0,W,H);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
